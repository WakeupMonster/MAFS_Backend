<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 Tinder Photo Reorder - API Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 20px;
      font-size: 14px;
    }

    /* ━━━ Config Section ━━━ */
    .config-section {
      max-width: 600px;
      margin: 0 auto 20px;
      background: #16213e;
      padding: 20px;
      border-radius: 12px;
    }

    .config-section label {
      display: block;
      margin-bottom: 5px;
      color: #aaa;
      font-size: 13px;
    }

    .config-section input {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0f3460;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .config-section input:focus {
      border-color: #e94560;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: scale(1.02);
    }

    .btn-primary {
      background: #e94560;
      color: #fff;
    }

    .btn-success {
      background: #0cbc87;
      color: #fff;
    }

    .btn-info {
      background: #0dcaf0;
      color: #000;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ━━━ Photo Grid — Tinder Style ━━━ */
    .grid-container {
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .photo-slot {
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      position: relative;
      cursor: grab;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .photo-slot:active {
      cursor: grabbing;
    }

    /* Photo filled slot */
    .photo-slot.filled {
      background-size: cover;
      background-position: center;
      border: 2px solid transparent;
    }

    .photo-slot.filled:hover {
      border-color: #e94560;
      transform: scale(1.03);
    }

    /* Empty slot */
    .photo-slot.empty {
      background: #16213e;
      border: 2px dashed #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-slot.empty::after {
      content: '+';
      font-size: 40px;
      color: #444;
    }

    /* Drag over effect */
    .photo-slot.drag-over {
      border: 3px solid #0dcaf0 !important;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(13, 202, 240, 0.4);
    }

    /* Dragging effect */
    .photo-slot.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }

    /* Order badge */
    .order-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
    }

    /* Primary badge */
    .primary-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: #ffc107;
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
    }

    /* PublicId label */
    .id-label {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 8px;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ━━━ Log Section ━━━ */
    .log-section {
      max-width: 600px;
      margin: 20px auto;
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
    }

    .log-section h3 {
      margin-bottom: 10px;
      color: #e94560;
    }

    .log-content {
      background: #0a0a23;
      border-radius: 8px;
      padding: 12px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 6px;
    }

    .log-entry.request {
      background: #1a1a4e;
      border-left: 3px solid #0dcaf0;
    }

    .log-entry.success {
      background: #1a3a2a;
      border-left: 3px solid #0cbc87;
    }

    .log-entry.error {
      background: #3a1a1a;
      border-left: 3px solid #e94560;
    }

    .log-entry .time {
      color: #666;
      font-size: 10px;
    }

    /* ━━━ Status Bar ━━━ */
    .status-bar {
      max-width: 600px;
      margin: 0 auto 15px;
      padding: 10px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      display: none;
    }

    .status-bar.show {
      display: block;
    }

    .status-bar.loading {
      background: #1a1a4e;
      color: #0dcaf0;
    }

    .status-bar.success {
      background: #1a3a2a;
      color: #0cbc87;
    }

    .status-bar.error {
      background: #3a1a1a;
      color: #e94560;
    }

    /* Current Order Display */
    .current-order {
      max-width: 600px;
      margin: 15px auto;
      background: #16213e;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
    }

    .current-order span {
      color: #0dcaf0;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>🔥 Tinder Photo Reorder</h1>
  <p class="subtitle">Drag & Drop photos to reorder — Test your API</p>

  <!-- ━━━ Config ━━━ -->
  <div class="config-section">
    <label>🌐 Base URL</label>
    <input type="text" id="baseUrl" value="http://localhost:3001" placeholder="http://localhost:3001" />

    <label>🔑 Auth Token (Bearer)</label>
    <input type="text" id="authToken" placeholder="Paste your JWT token here..." />

    <label>📡 Endpoint</label>
    <input type="text" id="endpoint" value="/api/v1/profile/photos/reorder" placeholder="/api/v1/profile/photos/reorder" />

    <label>📸 Get Profile Endpoint (to fetch photos)</label>
    <input type="text" id="profileEndpoint" value="/api/v1/profile/me" placeholder="/api/v1/profile/me" />

    <div class="btn-group">
      <button class="btn btn-primary" onclick="fetchPhotos()">📸 Fetch My Photos</button>
      <button class="btn btn-success" onclick="saveOrder()">💾 Save New Order</button>
      <button class="btn btn-info" onclick="loadDummyPhotos()">🧪 Load Dummy Photos</button>
    </div>
  </div>

  <!-- ━━━ Status ━━━ -->
  <div class="status-bar" id="statusBar"></div>

  <!-- ━━━ Current Order ━━━ -->
  <div class="current-order" id="currentOrder">
    📋 Current Order: <span>No photos loaded</span>
  </div>

  <!-- ━━━ Photo Grid ━━━ -->
  <div class="grid-container" id="photoGrid"></div>

  <!-- ━━━ Logs ━━━ -->
  <div class="log-section">
    <h3>📋 API Logs</h3>
    <div class="log-content" id="logContent">
      <div class="log-entry request">
        <div class="time">Ready</div>
        <div>👋 Paste your token, click "Fetch My Photos" to start</div>
      </div>
    </div>
  </div>


  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // STATE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let photos = [];
    let dragFromIndex = null;
    const MAX_SLOTS = 6;

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // FETCH PHOTOS FROM API
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function fetchPhotos() {
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const token = document.getElementById('authToken').value.trim();
      const profileEndpoint = document.getElementById('profileEndpoint').value.trim();

      if (!token) {
        showStatus('❌ Please enter auth token!', 'error');
        return;
      }

      showStatus('⏳ Fetching photos...', 'loading');
      addLog('request', `GET ${baseUrl}${profileEndpoint}`);

      try {
        const response = await fetch(`${baseUrl}${profileEndpoint}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();
        addLog(data.success ? 'success' : 'error', JSON.stringify(data, null, 2));

        if (data.success && data.data) {
          // ✅ Try to find photos array in response
          let userPhotos = null;

          if (data.data.user && data.data.user.photos) {
            userPhotos = data.data.user.photos;
          } else if (data.data.photos) {
            userPhotos = data.data.photos;
          } else if (data.data.user && data.data.user.profile && data.data.user.profile.photos) {
            userPhotos = data.data.user.profile.photos;
          }

          if (userPhotos && userPhotos.length > 0) {
            photos = userPhotos.map((p, i) => ({
              publicId: p.publicId || p.public_id || `photo_${i}`,
              url: p.url || p.imageUrl || p.secure_url || `https://picsum.photos/300/400?random=${i}`,
              order: p.order || i + 1,
              isPrimary: p.isPrimary || i === 0
            }));

            photos.sort((a, b) => a.order - b.order);
            renderGrid();
            showStatus(`✅ Loaded ${photos.length} photos!`, 'success');
          } else {
            showStatus('⚠️ No photos found in profile. Try "Load Dummy Photos"', 'error');
            addLog('error', 'No photos array found in response. Response structure: ' + JSON.stringify(Object.keys(data.data)));
          }
        } else {
          showStatus('❌ API error: ' + (data.message || 'Unknown'), 'error');
        }
      } catch (err) {
        showStatus('❌ Network error: ' + err.message, 'error');
        addLog('error', err.message);
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SAVE ORDER — API CALL
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function saveOrder() {
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const token = document.getElementById('authToken').value.trim();
      const endpoint = document.getElementById('endpoint').value.trim();

      if (!token) {
        showStatus('❌ Please enter auth token!', 'error');
        return;
      }

      if (photos.length === 0) {
        showStatus('❌ No photos to reorder!', 'error');
        return;
      }

      // ✅ photoIds array banao — current order mein
      const photoIds = photos.map(p => p.publicId);

      const requestBody = { photoIds };

      showStatus('⏳ Saving new order...', 'loading');
      addLog('request', `PATCH ${baseUrl}${endpoint}\n\nBody:\n${JSON.stringify(requestBody, null, 2)}`);

      try {
        const response = await fetch(`${baseUrl}${endpoint}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();
        addLog(data.success ? 'success' : 'error', JSON.stringify(data, null, 2));

        if (data.success) {
          showStatus('✅ Photos reordered successfully!', 'success');
        } else {
          showStatus('❌ ' + (data.message || 'Failed'), 'error');
        }
      } catch (err) {
        showStatus('❌ Network error: ' + err.message, 'error');
        addLog('error', err.message);
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // LOAD DUMMY PHOTOS (for testing without API)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function loadDummyPhotos() {
      photos = [
        {
          publicId: 'photo_abc123',
          url: 'https://picsum.photos/300/400?random=1',
          order: 1,
          isPrimary: true
        },
        {
          publicId: 'photo_def456',
          url: 'https://picsum.photos/300/400?random=2',
          order: 2,
          isPrimary: false
        },
        {
          publicId: 'photo_ghi789',
          url: 'https://picsum.photos/300/400?random=3',
          order: 3,
          isPrimary: false
        },
        {
          publicId: 'photo_jkl012',
          url: 'https://picsum.photos/300/400?random=4',
          order: 4,
          isPrimary: false
        }
      ];

      renderGrid();
      showStatus('✅ Loaded 4 dummy photos. Drag to reorder!', 'success');
      addLog('success', 'Loaded dummy photos:\n' + JSON.stringify(photos.map(p => p.publicId), null, 2));
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RENDER GRID
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderGrid() {
      const grid = document.getElementById('photoGrid');
      grid.innerHTML = '';

      for (let i = 0; i < MAX_SLOTS; i++) {
        const slot = document.createElement('div');
        slot.className = `photo-slot ${i < photos.length ? 'filled' : 'empty'}`;
        slot.dataset.index = i;

        if (i < photos.length) {
          const photo = photos[i];
          slot.style.backgroundImage = `url(${photo.url})`;
          slot.draggable = true;

          slot.innerHTML = `
            <div class="order-badge">${i + 1}</div>
            ${i === 0 ? '<div class="primary-badge">⭐ PRIMARY</div>' : ''}
            <div class="id-label">${photo.publicId}</div>
          `;

          // ✅ DRAG EVENTS
          slot.addEventListener('dragstart', handleDragStart);
          slot.addEventListener('dragend', handleDragEnd);
        }

        // ✅ DROP EVENTS (both filled and empt
        slot.addEventListener('dragover', handleDragOver);
        slot.addEventListener('dragenter', handleDragEnter);
        slot.addEventListener('dragleave', handleDragLeave);
        slot.addEventListener('drop', handleDrop);

        grid.appendChild(slot);
      }

      updateCurrentOrder();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // DRAG & DROP HANDLERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function handleDragStart(e) {
      dragFromIndex = parseInt(e.target.dataset.index);
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      dragFromIndex = null;
      // Remove all drag-over classes
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e) {
      e.preventDefault();
      e.target.closest('.photo-slot')?.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.target.closest('.photo-slot')?.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      const slot = e.target.closest('.photo-slot');
      if (!slot) return;

      slot.classList.remove('drag-over');
      const toIndex = parseInt(slot.dataset.index);

      if (dragFromIndex === null || dragFromIndex === toIndex) return;
      if (toIndex >= photos.length) return; // Can't drop on empty slot

      // ✅ SWAP!
      const temp = photos[toIndex];
      photos[toIndex] = photos[dragFromIndex];
      photos[dragFromIndex] = temp;

      addLog('request',
        `🔄 SWAPPED: Position ${dragFromIndex + 1} ↔ Position ${toIndex + 1}\n` +
        `New order: [${photos.map(p => p.publicId).join(', ')}]`
      );

      renderGrid();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // UPDATE CURRENT ORDER DISPLAY
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function updateCurrentOrder() {
      const orderDiv = document.getElementById('currentOrder');
      if (photos.length === 0) {
        orderDiv.innerHTML = '📋 Current Order: <span>No photos loaded</span>';
      } else {
        const ids = photos.map((p, i) => `${i + 1}.${p.publicId}`).join(' → ');
        orderDiv.innerHTML = `📋 Current Order: <span>${ids}</span>`;
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // UI HELPERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function showStatus(message, type) {
      const bar = document.getElementById('statusBar');
      bar.textContent = message;
      bar.className = `status-bar show ${type}`;
      if (type !== 'loading') {
        setTimeout(() => bar.classList.remove('show'), 5000);
      }
    }

    function addLog(type, message) {
      const log = document.getElementById('logContent');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<div class="time">${time}</div><pre style="white-space:pre-wrap;word-break:break-all;margin:0;color:#ddd">${message}</pre>`;
      log.insertBefore(entry, log.firstChild);
    }
  </script>

</body>
</html>
