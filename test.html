<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 Photo Reorder - Single Photo Move</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    h1 { text-align: center; margin-bottom: 5px; font-size: 24px; }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .config-section {
      max-width: 600px;
      margin: 0 auto 20px;
      background: #16213e;
      padding: 20px;
      border-radius: 12px;
    }

    .config-section label {
      display: block;
      margin-bottom: 5px;
      color: #aaa;
      font-size: 13px;
    }

    .config-section input {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0f3460;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .config-section input:focus { border-color: #e94560; }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:hover { transform: scale(1.02); }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-info { background: #0dcaf0; color: #000; }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Grid */
    .grid-container {
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .photo-slot {
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      position: relative;
      cursor: grab;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .photo-slot:active { cursor: grabbing; }

    .photo-slot.filled {
      background-size: cover;
      background-position: center;
      border: 2px solid transparent;
    }

    .photo-slot.filled:hover {
      border-color: #e94560;
      transform: scale(1.03);
    }

    .photo-slot.empty {
      background: #16213e;
      border: 2px dashed #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-slot.empty::after {
      content: '+';
      font-size: 40px;
      color: #444;
    }

    .photo-slot.drag-over {
      border: 3px solid #0dcaf0 !important;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(13, 202, 240, 0.4);
    }

    .photo-slot.dragging {
      opacity: 0.3;
      transform: scale(0.9);
      border: 2px dashed #e94560;
    }

    .order-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .primary-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: #ffc107;
      color: #000;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }

    .id-label {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 8px;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-bar {
      max-width: 600px;
      margin: 0 auto 15px;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      display: none;
    }

    .status-bar.show { display: block; }
    .status-bar.loading { background: #1a1a4e; color: #0dcaf0; }
    .status-bar.success { background: #1a3a2a; color: #0cbc87; }
    .status-bar.error { background: #3a1a1a; color: #e94560; }

    .current-order {
      max-width: 600px;
      margin: 15px auto;
      background: #16213e;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.8;
    }

    .current-order span { color: #0dcaf0; font-family: monospace; }
    .current-order .highlight { color: #ffc107; font-weight: bold; }

    .mode-badge {
      max-width: 600px;
      margin: 0 auto 10px;
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      background: #2a1a4e;
      color: #ffc107;
      border: 1px solid #ffc107;
    }

    .log-section {
      max-width: 600px;
      margin: 20px auto;
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
    }

    .log-section h3 { margin-bottom: 10px; color: #e94560; }

    .log-content {
      background: #0a0a23;
      border-radius: 8px;
      padding: 12px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 6px;
    }

    .log-entry.request { background: #1a1a4e; border-left: 3px solid #0dcaf0; }
    .log-entry.success { background: #1a3a2a; border-left: 3px solid #0cbc87; }
    .log-entry.error { background: #3a1a1a; border-left: 3px solid #e94560; }
    .log-entry.move { background: #2a1a4e; border-left: 3px solid #ffc107; }
    .log-entry .time { color: #666; font-size: 10px; }
  </style>
</head>
<body>

  <h1>🔥 Photo Reorder — Single Move</h1>
  <p class="subtitle">Drag photo to new position → API auto-called</p>

  <!-- Config -->
  <div class="config-section">
    <label>🌐 Base URL</label>
    <input type="text" id="baseUrl" value="http://localhost:3001" />

    <label>🔑 Auth Token</label>
    <input type="text" id="authToken" placeholder="Paste JWT token..." />

    <label>📡 Reorder Endpoint</label>
    <input type="text" id="endpoint" value="/api/v1/profile/photos/reorder" />

    <label>📸 Profile Endpoint</label>
    <input type="text" id="profileEndpoint" value="/api/v1/profile/me" />

    <div class="btn-group">
      <button class="btn btn-primary" onclick="fetchPhotos()">📸 Fetch Photos</button>
      <button class="btn btn-info" onclick="loadDummyPhotos()">🧪 Load Dummy</button>
    </div>
  </div>

  <!-- Mode -->
  <div class="mode-badge">
    📌 AUTO-SAVE: Jab drop karoge → API call automatically hoga → sirf moved photo ki ID jayegi
  </div>

  <!-- Status -->
  <div class="status-bar" id="statusBar"></div>

  <!-- Order -->
  <div class="current-order" id="currentOrder">
    📋 Current Order: <span>No photos loaded</span>
  </div>

  <!-- Grid -->
  <div class="grid-container" id="photoGrid"></div>

  <!-- Logs -->
  <div class="log-section">
    <h3>📋 API Logs</h3>
    <div class="log-content" id="logContent">
      <div class="log-entry request">
        <div class="time">Ready</div>
        <div>👋 Fetch photos or load dummy to start</div>
      </div>
    </div>
  </div>

  <script>
    let photos = [];
    let dragFromIndex = null;
    const MAX_SLOTS = 6;


    // ━━━━━━━━━━━━━━━━━━━━━━━━
    // FETCH PHOTOS
    // ━━━━━━━━━━━━━━━━━━━━━━━━
    async function fetchPhotos() {
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const token = document.getElementById('authToken').value.trim();
      const profileEndpoint = document.getElementById('profileEndpoint').value.trim();

      if (!token) { showStatus('❌ Enter token!', 'error'); return; }

      showStatus('⏳ Fetching...', 'loading');
      addLog('request', `GET ${baseUrl}${profileEndpoint}`);

      try {
        const response = await fetch(`${baseUrl}${profileEndpoint}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();
        addLog(data.success ? 'success' : 'error', JSON.stringify(data, null, 2));

        if (data.success && data.data) {
          let userPhotos = null;
          if (data.data.user && data.data.user.photos) userPhotos = data.data.user.photos;
          else if (data.data.photos) userPhotos = data.data.photos;

          if (userPhotos && userPhotos.length > 0) {
            photos = userPhotos.map((p, i) => ({
              publicId: p.publicId || p.public_id || `photo_${i}`,
              url: p.url || p.imageUrl || `https://picsum.photos/300/400?random=${i}`,
              order: p.order || i + 1,
              isPrimary: p.isPrimary || i === 0
            }));
            photos.sort((a, b) => a.order - b.order);
            renderGrid();
            showStatus(`✅ Loaded ${photos.length} photos!`, 'success');
          } else {
            showStatus('⚠️ No photos found', 'error');
          }
        }
      } catch (err) {
        showStatus('❌ ' + err.message, 'error');
        addLog('error', err.message);
      }
    }


    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ✅ MOVE PHOTO — API CALL (auto save)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function movePhotoAPI(photoId, toPosition) {
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const token = document.getElementById('authToken').value.trim();
      const endpoint = document.getElementById('endpoint').value.trim();

      const requestBody = {
        photoId: photoId,
        toPosition: toPosition
      };

      showStatus(`⏳ Moving photo to position ${toPosition}...`, 'loading');
      addLog('move',
        `📌 MOVE REQUEST:\n` +
        `   Photo: ${photoId}\n` +
        `   To Position: ${toPosition}\n\n` +
        `PATCH ${baseUrl}${endpoint}\n` +
        JSON.stringify(requestBody, null, 2)
      );

      try {
        const response = await fetch(`${baseUrl}${endpoint}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();
        addLog(data.success ? 'success' : 'error', JSON.stringify(data, null, 2));

        if (data.success) {
          showStatus(`✅ Photo moved to position ${toPosition}!`, 'success');

          // ✅ Response se updated photos le lo
          if (data.data && data.data.user && data.data.user.photos) {
            photos = data.data.user.photos.map((p, i) => ({
              publicId: p.publicId || p.public_id,
              url: p.url || p.imageUrl,
              order: p.order || i + 1,
              isPrimary: p.isPrimary || i === 0
            }));
            photos.sort((a, b) => a.order - b.order);
            renderGrid();
          }
        } else {
          showStatus('❌ ' + (data.message || 'Failed'), 'error');
          renderGrid(); // Revert UI
        }
      } catch (err) {
        showStatus('❌ ' + err.message, 'error');
        addLog('error', err.message);
        renderGrid(); // Revert UI
      }
    }


    // ━━━━━━━━━━━━━━━━━━━━━━━━
    // LOAD DUMMY
    // ━━━━━━━━━━━━━━━━━━━━━━━━
    function loadDummyPhotos() {
      photos = [
        { publicId: 'mafs/users/123/photos/aaa', url: 'https://picsum.photos/300/400?random=11', order: 1, isPrimary: true },
        { publicId: 'mafs/users/123/photos/bbb', url: 'https://picsum.photos/300/400?random=22', order: 2, isPrimary: false },
        { publicId: 'mafs/users/123/photos/ccc', url: 'https://picsum.photos/300/400?random=33', order: 3, isPrimary: false },
        { publicId: 'mafs/users/123/photos/ddd', url: 'https://picsum.photos/300/400?random=44', order: 4, isPrimary: false },
      ];
      renderGrid();
      showStatus('✅ Loaded 4 dummy photos!', 'success');
    }


    // ━━━━━━━━━━━━━━━━━━━━━━━━
    // RENDER GRID
    // ━━━━━━━━━━━━━━━━━━━━━━━━
    function renderGrid() {
      const grid = document.getElementById('photoGrid');
      grid.innerHTML = '';

      for (let i = 0; i < MAX_SLOTS; i++) {
        const slot = document.createElement('div');
        slot.dataset.index = i;

        if (i < photos.length) {
          const photo = photos[i];
          slot.className = 'photo-slot filled';
          slot.style.backgroundImage = `url(${photo.url})`;
          slot.draggable = true;

          // Short ID for display
          const shortId = photo.publicId.split('/').pop();

          slot.innerHTML = `
            <div class="order-badge">${i + 1}</div>
            ${i === 0 ? '<div class="primary-badge">⭐ PRIMARY</div>' : ''}
            <div class="id-label">${shortId}</div>
          `;

          slot.addEventListener('dragstart', handleDragStart);
          slot.addEventListener('dragend', handleDragEnd);
        } else {
          slot.className = 'photo-slot empty';
        }

        slot.addEventListener('dragover', handleDragOver);
        slot.addEventListener('dragenter', handleDragEnter);
        slot.addEventListener('dragleave', handleDragLeave);
        slot.addEventListener('drop', handleDrop);

        grid.appendChild(slot);
      }

      updateCurrentOrder();
    }


    // ━━━━━━━━━━━━━━━━━━━━━━━━
    // DRAG & DROP
    // ━━━━━━━━━━━━━━━━━━━━━━━━
    function handleDragStart(e) {
      dragFromIndex = parseInt(e.target.dataset.index);
      setTimeout(() => e.target.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      dragFromIndex = null;
      document.querySelectorAll('.drag-over')
        .forEach(el => el.classList.remove('drag-over'));
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e) {
      e.preventDefault();
      e.target.closest('.photo-slot')?.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.target.closest('.photo-slot')?.classList.remove('drag-over');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ✅ DROP → LOCAL INSERT + API CALL
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function handleDrop(e) {
      e.preventDefault();
      const slot = e.target.closest('.photo-slot');
      if (!slot) return;

      slot.classList.remove('drag-over');
      const toIndex = parseInt(slot.dataset.index);

      if (dragFromIndex === null) return;
      if (dragFromIndex === toIndex) return;
      if (toIndex >= photos.length) return;

      const movedPhoto = photos[dragFromIndex];
      const toPosition = toIndex + 1;

      // ✅ Local mein INSERT karo (instant UI update)
      photos.splice(dragFromIndex, 1);
      photos.splice(toIndex, 0, movedPhoto);
      renderGrid();

      // ✅ API call — sirf photoId aur toPosition bhejo
      movePhotoAPI(movedPhoto.publicId, toPosition);
    }


    // ━━━━━━━━━━━━━━━━━━━━━━━━
    // HELPERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━
    function updateCurrentOrder() {
      const orderDiv = document.getElementById('currentOrder');
      if (photos.length === 0) {
        orderDiv.innerHTML = '📋 Current Order: <span>No photos loaded</span>';
        return;
      }
      const orderHtml = photos.map((p, i) => {
        const shortId = p.publicId.split('/').pop();
        const cls = i === 0 ? ' class="highlight"' : '';
        return `<span${cls}>${i + 1}.${shortId}${i === 0 ? ' ⭐' : ''}</span>`;
      }).join(' → ');
      orderDiv.innerHTML = `📋 Current Order: ${orderHtml}`;
    }

    function showStatus(message, type) {
      const bar = document.getElementById('statusBar');
      bar.textContent = message;
      bar.className = `status-bar show ${type}`;
      if (type !== 'loading') setTimeout(() => bar.classList.remove('show'), 5000);
    }

    function addLog(type, message) {
      const log = document.getElementById('logContent');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<div class="time">${time}</div><pre style="white-space:pre-wrap;word-break:break-all;margin:0;color:#ddd">${message}</pre>`;
      log.insertBefore(entry, log.firstChild);
    }
  </script>

</body>
</html>
