<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Admin Dashboard Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #16213e; padding: 20px; border-radius: 12px; border: 1px solid #0f3460; margin-bottom: 20px; }
        .activity-item { padding: 15px; border-left: 4px solid #F75555; background: #0f3460; margin: 10px 0; border-radius: 4px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .status { padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .online { background: #4caf50; }
        .offline { background: #f44336; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0f3460; border: 1px solid #1a1a2e; color: white; border-radius: 4px; }
        button { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff5e78; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Admin Live Activity Monitor</h1>
        
        <div class="card">
            <h3>Connection Settings</h3>
            <input type="text" id="token" placeholder="Enter Admin JWT Token here...">
            <button onclick="connect()">🚀 Connect & Join Dashboard</button>
            <p>Status: <span id="status" class="status offline">Disconnected</span></p>
        </div>

        <div class="card">
            <h3>Recent Activities</h3>
            <div id="activity-feed">
                <p style="color: #888;">Waiting for live updates...</p>
            </div>
        </div>
    </div>

    <script>
        let socket;
        const feed = document.getElementById('activity-feed');
        const statusLabel = document.getElementById('status');

        function connect() {
            const token = document.getElementById('token').value.trim();
            if(!token) return alert("Bhai, Token toh daalo!");

            statusLabel.innerText = "Connecting...";
            
            // Connect to server
            socket = io("http://localhost:3001", {
                query: { token: token },
                transports: ['websocket']
            });

            socket.on("connect", () => {
                statusLabel.innerText = "Connected & Joined Room";
                statusLabel.className = "status online";
                console.log("Connected as:", socket.id);
                
                // Join the admin dashboard room
                socket.emit("join_admin_dashboard");
                
                // Also send the raw join just in case
                socket.send("join_admin_dashboard");
            });

            socket.on("new_live_activity", (data) => {
                console.log("New Activity:", data);
                addActivity(data);
            });

            socket.on("disconnect", () => {
                statusLabel.innerText = "Disconnected";
                statusLabel.className = "status offline";
            });

            socket.on("connect_error", (err) => {
                alert("Connection Error: " + err.message);
                statusLabel.innerText = "Error: " + err.message;
            });
        }

        function addActivity(data) {
            const div = document.createElement('div');
            div.className = 'activity-item';
            div.style.borderLeftColor = data.color || '#F75555';
            div.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 5px;">${data.description}</div>
                <div style="font-size: 11px; color: #888; display: flex; justify-content: space-between;">
                    <span>ID: ${data.id}</span>
                    <span>${data.time}</span>
                </div>
            `;
            
            // Remove the "Waiting" message
            if(feed.innerText === "Waiting for live updates...") feed.innerHTML = '';
            
            feed.prepend(div);
        }
    </script>
</body>
</html>
