name: CD - Deploy to AWS

on:
  push:
    branches: ["main", "dev"]

# Prevent parallel deployments to the same environmenttt
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Docker Image (for scanning)
        id: build-local
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.ref == 'refs/heads/main' && secrets.ECR_PROD_REPO || secrets.ECR_STAGING_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ github.ref == 'refs/heads/main' && secrets.ECR_PROD_REPO || secrets.ECR_STAGING_REPO }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Amazon ECR
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.ref == 'refs/heads/main' && secrets.ECR_PROD_REPO || secrets.ECR_STAGING_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # No 'latest' tag for production to ensure strict immutability
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ github.ref != 'refs/heads/main' && format('{0}/{1}:latest', env.ECR_REGISTRY, env.ECR_REPOSITORY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get ECR Login Password
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region ap-southeast-2)
          echo "::add-mask::$TOKEN"
          echo "password=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.ref == 'refs/heads/main' && secrets.ECR_PROD_REPO || secrets.ECR_STAGING_REPO }}
          IMAGE_TAG: ${{ github.sha }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,EC2_USER,ECR_PASSWORD
          script_stop: true
          script: |
            echo "🚀 Starting deployment..."
            echo "Registry: $ECR_REGISTRY"
            echo "Repository: $ECR_REPOSITORY"
            echo "Image Tag: $IMAGE_TAG"

            # 1. AWS CLI se ECR Login karo (Runner se password pass kiya hai)
            echo "🔐 Logging into ECR..."
            echo "$ECR_PASSWORD" | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # 2. Nayi image pull karo
            FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            echo "📦 Pulling image: $FULL_IMAGE"
            sudo docker pull "$FULL_IMAGE"

            # 3. Purana container ruko aur naya start karo
            echo "🛑 Stopping old container..."
            sudo docker stop mafs-backend || true
            sudo docker rm mafs-backend || true

            echo "🟢 Starting new container..."
            sudo docker run -d \
              --name mafs-backend \
              --network host \
              --restart always \
              --env-file /home/$EC2_USER/.env \
              -v /home/$EC2_USER/config/firebase-service-account.json:/app/config/firebase-service-account.json \
              -v /home/$EC2_USER/certs/SubscriptionKey_3659YR6BSM.p8:/app/certs/SubscriptionKey_3659YR6BSM.p8 \
              -v /home/$EC2_USER/keys/google-service-account.json:/app/keys/google-service-account.json \
              -e NODE_ENV=production \
              "$FULL_IMAGE"

            # 4. Wait and verify container is actually running
            echo "⏳ Waiting for container to start..."
            sleep 8

            if sudo docker ps --format '{{.Names}}' | grep -q "mafs-backend"; then
              echo "✅ Container 'mafs-backend' is running!"
              echo "--- Container Info ---"
              sudo docker ps --filter "name=mafs-backend" --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
              echo "--- Last 30 log lines ---"
              sudo docker logs --tail 30 mafs-backend
            else
              echo "❌ ERROR: Container 'mafs-backend' is NOT running!"
              echo "--- Container logs (if any) ---"
              sudo docker logs mafs-backend 2>&1 || true
              exit 1
            fi

            # 5. Cleaning (Purani images delete karo space bachane ke liye)
            sudo docker image prune -af
            echo "🎉 Deployment complete!"